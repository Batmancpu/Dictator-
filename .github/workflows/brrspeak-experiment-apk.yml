name: brrSpeak audio-source experiment APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'gradle/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/brrspeak-experiment-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already supplies an Android SDK. The setup-android action's
      # legacy `sdkmanager tools` install fails because that package was retired.
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore optional persistent brrSpeak test signing key
        env:
          BRRSPEAK_KEYSTORE_BASE64: ${{ secrets.BRRSPEAK_KEYSTORE_BASE64 }}
          BRRSPEAK_STORE_PASSWORD: ${{ secrets.BRRSPEAK_STORE_PASSWORD }}
          BRRSPEAK_KEY_ALIAS: ${{ secrets.BRRSPEAK_KEY_ALIAS }}
          BRRSPEAK_KEY_PASSWORD: ${{ secrets.BRRSPEAK_KEY_PASSWORD }}
        run: |
          if [[ -z "$BRRSPEAK_KEYSTORE_BASE64" ]]; then
            echo '::warning::No persistent signing key configured. This test APK may need reinstalling after a future build.'
            exit 0
          fi
          if [[ -z "$BRRSPEAK_STORE_PASSWORD" || -z "$BRRSPEAK_KEY_ALIAS" || -z "$BRRSPEAK_KEY_PASSWORD" ]]; then
            echo '::error::Incomplete brrSpeak signing secrets. Configure all four secrets or none.'
            exit 1
          fi
          umask 077
          printf '%s' "$BRRSPEAK_KEYSTORE_BASE64" | base64 --decode > brrspeak-signing.jks
          test -s brrspeak-signing.jks
      - name: Fetch verified upstream speech model native libraries
        run: bash tools/fetch-sherpa-onnx.sh
      - name: Build separately installable brrSpeak APK
        env:
          BRRSPEAK_STORE_PASSWORD: ${{ secrets.BRRSPEAK_STORE_PASSWORD }}
          BRRSPEAK_KEY_ALIAS: ${{ secrets.BRRSPEAK_KEY_ALIAS }}
          BRRSPEAK_KEY_PASSWORD: ${{ secrets.BRRSPEAK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleExperiment -PbrrSpeakExperiment=true
      - name: Run experiment unit tests before publication
        # AGP exposes the ordinary debug unit-test variant, not a dedicated experiment task.
        # Both variants compile the same src/main recognition/privacy implementation.
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest -PbrrSpeakExperiment=true
      - name: Name APK for Obtainium
        run: cp app/build/outputs/apk/experiment/app-experiment.apk brrSpeak.apk
      - name: Validate APK and installation identity
        run: |
          test -s brrSpeak.apk
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$aapt_bin" dump badging brrSpeak.apk | grep -F "package: name='com.mangoloads.speak'"
          "$aapt_bin" dump xmltree brrSpeak.apk AndroidManifest.xml | grep -F 'AudioSourceProbeActivity'
          "$aapt_bin" dump xmltree brrSpeak.apk AndroidManifest.xml | grep -F 'BoardRecordedAudioService'
          "$aapt_bin" dump xmltree brrSpeak.apk AndroidManifest.xml | grep -F 'BoardAudioWakeProvider'
          sha256sum brrSpeak.apk
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brrSpeak-audio-source-experiment
          path: brrSpeak.apk
          if-no-files-found: error
      - name: Publish latest Obtainium-compatible test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="brrspeak-audio-source-test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            brrSpeak.apk \
            --title "brrSpeak audio-source experiment ${GITHUB_RUN_NUMBER}" \
            --notes "EXPERIMENTAL TEST BUILD, published as the latest non-prerelease solely for Obtainium compatibility. Package: com.mangoloads.speak (NOT net.devemperor.dictate.debug). Open brrSpeak Settings > Home > brrSpeak audio-source test. Includes brrBoard-only UID-verified no-data cold-start ContentProvider handshake followed by the explicit bound-service receiver for complete 16 kHz PCM16 read-only audio; final-text-only callback. brrSpeak need not remain open in the background. The old same-app audio-source probe remains available. Configure a transcription provider first. In-place updates require the optional persistent BRRSPEAK signing secrets; otherwise a later test build may require reinstalling. Not an upstream Dictate release." \
            --latest --target "$GITHUB_SHA"
