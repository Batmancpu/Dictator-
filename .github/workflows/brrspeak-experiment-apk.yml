name: brrSpeak audio-source experiment APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'gradle/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/brrspeak-experiment-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already supplies an Android SDK. The setup-android action's
      # legacy `sdkmanager tools` install fails because that package was retired.
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch verified upstream speech model native libraries
        run: bash tools/fetch-sherpa-onnx.sh
      - name: Build separately installable brrSpeak APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleExperiment -PbrrSpeakExperiment=true
      - name: Validate APK and installation identity
        run: |
          test -s app/build/outputs/apk/experiment/app-experiment.apk
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$aapt_bin" dump badging app/build/outputs/apk/experiment/app-experiment.apk | grep -F "package: name='com.mangoloads.speak'"
          sha256sum app/build/outputs/apk/experiment/app-experiment.apk
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brrSpeak-audio-source-experiment
          path: app/build/outputs/apk/experiment/app-experiment.apk
          if-no-files-found: error
      - name: Publish test-only prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="brrspeak-audio-source-test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            'app/build/outputs/apk/experiment/app-experiment.apk#brrSpeak-experiment.apk' \
            --title "brrSpeak audio-source experiment ${GITHUB_RUN_NUMBER}" \
            --notes "Test-only Android 15 PCM16 EXTRA_AUDIO_SOURCE receiver. Package: com.mangoloads.speak. Requires a caller app that sends the PCM file descriptor. Debug-signed for testing; a future build may require uninstalling this APK before installing a differently signed version. Not an upstream Dictate release." \
            --prerelease --latest=false --target "$GITHUB_SHA"
