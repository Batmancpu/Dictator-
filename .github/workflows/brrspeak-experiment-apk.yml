name: brrSpeak audio-source experiment APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'gradle/**'
      - 'tools/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/brrspeak-experiment-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # ubuntu-latest already supplies an Android SDK. The setup-android action's
      # legacy `sdkmanager tools` install fails because that package was retired.
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch verified upstream speech model native libraries
        run: bash tools/fetch-sherpa-onnx.sh
      - name: Build separately installable brrSpeak APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleExperiment -PbrrSpeakExperiment=true
      - name: Name APK for Obtainium
        run: cp app/build/outputs/apk/experiment/app-experiment.apk brrSpeak.apk
      - name: Validate APK and installation identity
        run: |
          test -s brrSpeak.apk
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$aapt_bin" dump badging brrSpeak.apk | grep -F "package: name='com.mangoloads.speak'"
          sha256sum brrSpeak.apk
      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brrSpeak-audio-source-experiment
          path: brrSpeak.apk
          if-no-files-found: error
      - name: Publish latest Obtainium-compatible test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="brrspeak-audio-source-test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            brrSpeak.apk \
            --title "brrSpeak audio-source experiment ${GITHUB_RUN_NUMBER}" \
            --notes "EXPERIMENTAL TEST BUILD, published as the latest non-prerelease solely for Obtainium compatibility. Package: com.mangoloads.speak (NOT net.devemperor.dictate.debug). Includes a standalone launcher test that supplies 16 kHz PCM16 audio to the RecognitionService through EXTRA_AUDIO_SOURCE. Configure the transcription provider in brrSpeak first. GitHub Actions debug signing may change between runs; future test builds may require reinstalling. Not an upstream Dictate release." \
            --latest --target "$GITHUB_SHA"
