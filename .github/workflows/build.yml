name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: dictate-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Persistent Keystore
        run: |
          if [ ! -f "signing.keystore" ]; then
            echo "signing.keystore is missing; refusing to generate a new key because that would break APK updates."
            exit 1
          fi
          mkdir -p ~/.android
          cp signing.keystore ~/.android/debug.keystore

      - name: Install Android Build Dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "cmake;4.1.2"             "ndk;29.0.14206865"

      - name: Grant Execute Permissions
        run: |
          chmod +x gradlew
          chmod +x tools/fetch-sherpa-onnx.sh
          chmod +x tools/bergamot/build-android.sh

      - name: Fetch Sherpa ONNX Libraries
        run: ./tools/fetch-sherpa-onnx.sh

      - name: Build Bergamot Translation Library
        run: ./tools/bergamot/build-android.sh arm64-v8a

      - name: Calculate Update-Safe Version Code
        run: |
          BASE_VERSION_CODE=$(grep '^projectVersionCode=' gradle.properties | cut -d= -f2)
          CI_VERSION_CODE=$((BASE_VERSION_CODE * 100000 + GITHUB_RUN_NUMBER))
          echo "CI_VERSION_CODE=$CI_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building versionCode=$CI_VERSION_CODE from upstream base=$BASE_VERSION_CODE and run=$GITHUB_RUN_NUMBER"

      - name: Build APK
        run: ./gradlew assembleDebug -PprojectVersionCode="${CI_VERSION_CODE}"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dictate Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
